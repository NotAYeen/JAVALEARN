name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  verificar:
    name: Tests y validacion de niveles
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - name: Instalar dependencias
        run: npm ci

      - name: Tests
        run: npm test

      - name: Validar niveles contra el motor
        run: npm run validate

      - name: Validar niveles contra OpenJDK 17 real
        run: npm run validate -- --jdk
